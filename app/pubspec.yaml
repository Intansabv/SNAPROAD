name: snaproad
description: SNAPROAD - klasifikasi tingkat kerusakan jalan on-device (Flutter + TensorFlow Lite).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  geolocator: ">=12.0.0 <15.0.0"
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  image: ">=4.2.0 <5.0.0"
  tflite_flutter: ">=0.11.0 <1.0.0"
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/model/
